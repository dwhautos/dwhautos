<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2748"><title>DWH Autos — Job Cards</title>
<style>
:root{--navy:#0b2748;--blue:#0757a6;--green:#20a447;--line:#dbe2ea;--bg:#f5f7fa;--text:#142033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.app{max-width:1100px;margin:auto;background:#fff;min-height:100vh;padding:20px 24px 100px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}.logo{width:270px;height:105px;object-fit:contain;object-position:left center}
.header-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:9px;padding:13px 18px;font-weight:700}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{border-color:#c63d3d;color:#b62d2d}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0;background:#fff}
h2{font-size:21px;color:var(--blue);margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.wide{grid-column:1/-1}
label{display:block;font-weight:700;margin-bottom:7px}input[type=text],input[type=date],input[type=number],input[type=search]{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:13px;background:#fff}
.date-row{display:flex;justify-content:flex-end;align-items:center;gap:10px}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid var(--line);min-height:54px}.item:last-child{border-bottom:0}
.item .text{flex:1}.item.done .text{text-decoration:line-through;opacity:.6}.check{width:28px;height:28px;accent-color:var(--green);flex:0 0 auto}
.drag{color:#7b8795;font-size:20px}.remove{border:0;background:transparent;color:#b62d2d;font-size:18px}.add-row{display:flex;gap:10px;margin-top:10px}.add-row input{flex:1}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.photo{position:relative;width:120px;height:90px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:3px;top:3px;border:0;border-radius:50%;background:#fff;color:#b62d2d;width:26px;height:26px}
.bottom{display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:10px;background:rgba(255,255,255,.96);padding:12px 0;border-top:1px solid var(--line)}
.hidden{display:none!important}.muted{color:#64748b;font-size:14px}.job-list{display:grid;gap:10px}.job-row{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.job-info strong{display:block;font-size:17px}.job-info small{color:#64748b}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:9px;display:none;z-index:10}
@media(max-width:700px){.app{padding:12px 12px 90px}.logo{width:210px;height:85px}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.header-actions{width:100%}.header-actions .btn{flex:1}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.date-row{justify-content:stretch;flex-direction:column;align-items:stretch}.bottom{flex-wrap:wrap}.bottom .btn{flex:1}}
</style></head><body>

<div class="header-actions">
<button class="btn" onclick="showJobs()">View Job Cards</button>
<button class="btn" onclick="backupData()">BACKUP</button>
<button class="btn" onclick="document.getElementById('restoreInput').click()">RESTORE</button>
<input id="restoreInput" type="file" accept=".json,application/json" class="hidden" onchange="restoreData(event)">
<button class="btn primary" onclick="newJob()">+ New Job Card</button>
</div>
</header>

<section id="editor">
<div class="date-row"><label style="margin:0">Date</label><input id="date" type="date" style="max-width:220px"></div>
<div class="card"><h2>VEHICLE DETAILS</h2><div class="grid">
<div class="wide"><label>Customer Name</label><input id="customer" type="text"></div>
<div><label>Make</label><input id="make" type="text"></div><div><label>Model</label><input id="model" type="text"></div><div><label>Reg</label><input id="reg" type="text"></div>
<div class="wide"><label>Miles</label><input id="miles" type="number" inputmode="numeric"></div></div></div>

<div class="card"><h2>CUSTOMER REQUEST</h2><div id="requests" class="list"></div>
<div class="add-row"><input id="requestInput" placeholder="Type a new request and press Add" onkeydown="if(event.key==='Enter')addItem('requests','requestInput')"><button class="btn" onclick="addItem('requests','requestInput')">+ ADD</button></div></div>

<div class="card"><h2>ADVISORIES</h2><div id="advisories" class="list"></div>
<div class="add-row"><input id="advisoryInput" placeholder="Type a new advisory and press Add" onkeydown="if(event.key==='Enter')addItem('advisories','advisoryInput')"><button class="btn" onclick="addItem('advisories','advisoryInput')">+ ADD</button></div></div>

<div class="card"><h2>PHOTOS <span id="photoCount" class="muted">0 photos</span></h2>
<input id="photoInput" type="file" accept="image/*" capture="environment" multiple class="hidden" onchange="addPhotos(event)">
<button class="btn" onclick="document.getElementById('photoInput').click()">📷 ADD PHOTOS</button><div id="photos" class="photos"></div></div>

<div class="bottom"><button class="btn danger" onclick="newJob()">CANCEL</button><button class="btn" onclick="saveJob(false)">SAVE DRAFT</button><button class="btn primary" onclick="saveJob(true)">✓ COMPLETE JOB CARD</button></div>
</section>

<section id="jobs" class="hidden"><div class="card"><h2>JOB CARDS</h2>
<div style="display:flex;gap:10px;margin-bottom:14px"><input id="search" type="search" placeholder="Search customer or registration" oninput="renderJobs()"><button class="btn" onclick="newJob()">+ NEW</button></div>
<div id="jobList" class="job-list"></div></div></section></div><div id="toast" class="toast"></div>

<script>
const KEY='dwh_autos_jobcards_v1';let jobs=JSON.parse(localStorage.getItem(KEY)||'[]'),currentId=null,photos=[];
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function newJob(){currentId=null;photos=[];$('date').value=today();['customer','make','model','reg','miles'].forEach(id=>$(id).value='');$('requests').innerHTML='';$('advisories').innerHTML='';renderPhotos();$('editor').classList.remove('hidden');$('jobs').classList.add('hidden');scrollTo(0,0)}
function addItem(listId,inputId,text='',done=false){let input=$(inputId),value=(text||input.value).trim();if(!value)return;let row=document.createElement('div');row.className='item'+(done?' done':'');row.innerHTML='<span class="drag">⋮⋮</span><span class="text">'+esc(value)+'</span><input class="check" type="checkbox" '+(done?'checked':'')+'><button class="remove">✕</button>';row.querySelector('.check').onchange=e=>row.classList.toggle('done',e.target.checked);row.querySelector('.remove').onclick=()=>row.remove();$(listId).appendChild(row);input.value='';input.focus()}
function readItems(id){return [...$(id).querySelectorAll('.item')].map(r=>({text:r.querySelector('.text').textContent,done:r.querySelector('.check').checked}))}
function addPhotos(e){[...e.target.files].forEach(file=>{let r=new FileReader();r.onload=ev=>{photos.push(ev.target.result);renderPhotos()};r.readAsDataURL(file)});e.target.value=''}
function renderPhotos(){$('photoCount').textContent=photos.length+' photo'+(photos.length===1?'':'s');$('photos').innerHTML=photos.map((p,i)=>'<div class="photo"><img src="'+p+'"><button onclick="photos.splice('+i+',1);renderPhotos()">✕</button></div>').join('')}
function saveJob(completed){let job={id:currentId||Date.now(),date:$('date').value||today(),customer:$('customer').value.trim(),make:$('make').value.trim(),model:$('model').value.trim(),reg:$('reg').value.trim().toUpperCase(),miles:$('miles').value,requests:readItems('requests'),advisories:readItems('advisories'),photos:[...photos],status:completed?'Completed':'Draft'};if(!job.customer&&!job.reg){toast('Enter a customer name or registration');return}let i=jobs.findIndex(x=>x.id===job.id);if(i>=0)jobs[i]=job;else jobs.unshift(job);localStorage.setItem(KEY,JSON.stringify(jobs));currentId=job.id;toast(completed?'Job card completed':'Draft saved');setTimeout(showJobs,450)}
function showJobs(){$('editor').classList.add('hidden');$('jobs').classList.remove('hidden');renderJobs();scrollTo(0,0)}
function renderJobs(){let q=($('search')?.value||'').toLowerCase(),list=jobs.filter(j=>(j.customer+' '+j.reg+' '+j.make+' '+j.model).toLowerCase().includes(q));$('jobList').innerHTML=list.length?list.map(j=>'<div class="job-row"><div class="job-info"><strong>'+esc(j.customer||'No customer')+' — '+esc(j.reg||'No reg')+'</strong><small>'+esc(j.make+' '+j.model)+' · '+esc(j.date)+' · '+esc(j.status)+'</small></div><div><button class="btn" onclick="editJob('+j.id+')">OPEN</button> <button class="btn danger" onclick="deleteJob('+j.id+')">DELETE</button></div></div>').join(''):'<p class="muted">No job cards found.</p>'}
function editJob(id){let j=jobs.find(x=>x.id===id);if(!j)return;currentId=id;photos=j.photos||[];$('date').value=j.date||today();$('customer').value=j.customer||'';$('make').value=j.make||'';$('model').value=j.model||'';$('reg').value=j.reg||'';$('miles').value=j.miles||'';$('requests').innerHTML='';$('advisories').innerHTML='';(j.requests||[]).forEach(x=>addItem('requests','requestInput',x.text,x.done));(j.advisories||[]).forEach(x=>addItem('advisories','advisoryInput',x.text,x.done));renderPhotos();$('jobs').classList.add('hidden');$('editor').classList.remove('hidden');scrollTo(0,0)}
function deleteJob(id){if(!confirm('Delete this job card?'))return;jobs=jobs.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(jobs));renderJobs();toast('Job card deleted')}

async function backupData(){
  const payload={app:"DWH Autos Job Cards",version:1,exported:new Date().toISOString(),jobs};
  const filename="DWH_Autos_Job_Cards_Backup_"+today()+".json";
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const file=new File([blob],filename,{type:"application/json"});
  // On Android, use the system share/save sheet first. This avoids Chrome's
  // "Download insecure file?" warning when the app is opened as a local file.
  if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
    try{
      await navigator.share({title:"DWH Autos Job Cards Backup",text:"DWH Autos job-card backup",files:[file]});
      toast("Backup ready");
      return;
    }catch(err){
      if(err && err.name==="AbortError") return;
    }
  }
  // Fallback for browsers without file sharing.
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Backup downloaded");
}
function restoreData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data || !Array.isArray(data.jobs)) throw new Error();
      if(!confirm("Restore this backup? Existing job cards on this tablet will be replaced.")) return;
      jobs=data.jobs;localStorage.setItem(KEY,JSON.stringify(jobs));showJobs();toast("Backup restored");
    }catch(err){alert("That backup file could not be read.");}
    e.target.value="";
  };
  reader.readAsText(file);
}
newJob();
